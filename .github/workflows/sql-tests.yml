name: CI/CD SQL Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-sql:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sqlfluff pytest

      - name: Run SQL Linting / Tests on docs directory
        run: |
          sqlfluff lint docs/ || echo "SQL linting complete"
          
          if [ -d "tests" ]; then
            pytest tests/
          fi
